name: Deploy register

# Publishes the website, database rules and file rules to Firebase.
#   - every push to main deploys to the TEST project
#   - run the workflow by hand ("Run workflow") and pick "live" to update the real register
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Which Firebase project"
        type: choice
        options: [test, live]
        default: test

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase tools
        run: npm install -g firebase-tools@13
      - name: Deploy
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ] || [ -z "$PROJECT_ID" ]; then
            echo "Set the FIREBASE_SERVICE_ACCOUNT secret and FIREBASE_PROJECT_ID variable for this environment (see README)."; exit 1
          fi
          if [ -n "$FIREBASE_WEB_CONFIG" ]; then
            node scripts/write-config.mjs "$FIREBASE_WEB_CONFIG" public/firebase-config.js
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --project "$PROJECT_ID" --only hosting,firestore:rules,firestore:indexes,storage --non-interactive
